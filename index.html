        const buttons = document.querySelectorAll(selector);
        buttons.forEach(btn => {
          btn.addEventListener('click', () => {
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            callback(btn.dataset[dataKey]);
          });
        });
      }

      bindPillGroup('.grav-btn', 'gravity', val => { state.gravityMode = val; });
      bindPillGroup('.helmet-btn', 'helmet', val => { state.helmetColor = val; });
      bindPillGroup('.scooter-btn', 'scooter', val => { state.scooterStyle = val; });
      bindPillGroup('.acc-btn', 'acc', val => { state.accessory = val; });
      bindPillGroup('.weather-btn', 'weather', val => { state.weather = val; });

      // Scarf color buttons
      const scarfBtns = document.querySelectorAll('.scarf-btn');
      scarfBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          scarfBtns.forEach(b => {
            b.classList.remove('ring-2', 'ring-white', 'scale-110');
            b.classList.add('opacity-75');
          });
          btn.classList.remove('opacity-75');
          btn.classList.add('ring-2', 'ring-white', 'scale-110');
          state.scarfColor = btn.dataset.scarf;
        });
      });

      // Action Buttons
      document.getElementById('btnHonk').addEventListener('click', triggerHonk);
      document.getElementById('btnFeed').addEventListener('click', triggerFeedTreat);

      // Click anywhere on canvas to place obstacle
      canvas.addEventListener('pointerdown', e => {
        const clickX = Math.max(W * 0.48, e.clientX);
        spawnObstacleAt(clickX, e.clientY);
      });

      // Keyboard Shortcuts (Space/H = Honk, F = Feed)
      window.addEventListener('keydown', e => {
        if (e.code === 'Space' || e.key.toLowerCase() === 'h') {
          e.preventDefault();
          triggerHonk();
        } else if (e.key.toLowerCase() === 'f') {
          triggerFeedTreat();
        }
      });

      // Bottom Sheet Logic
      const controlPanel = document.getElementById("controlPanel");
      const btnTogglePanelClose = document.getElementById("btnTogglePanelClose");
      const btnShowPanel = document.getElementById("btnShowPanel");
      const bottomSheetOverlay = document.getElementById("bottomSheetOverlay");
      const dragHandleArea = document.getElementById("dragHandleArea");

      function closeSheet() {
        controlPanel.style.transform = "translateY(100%)";
        bottomSheetOverlay.classList.remove("active");
        btnShowPanel.style.display = "flex";
      }

      function openSheet() {
        controlPanel.style.transform = "translateY(0)";
        bottomSheetOverlay.classList.add("active");
        btnShowPanel.style.display = "none";
      }

      if(btnTogglePanelClose) btnTogglePanelClose.addEventListener("click", closeSheet);
      btnShowPanel.addEventListener("click", openSheet);
      bottomSheetOverlay.addEventListener("click", closeSheet);
      if(dragHandleArea) {
        dragHandleArea.addEventListener("click", closeSheet);

        let startY = 0;
        let currentY = 0;
        let isDragging = false;

        dragHandleArea.addEventListener("touchstart", (e) => {
          startY = e.touches[0].clientY;
          isDragging = true;
          controlPanel.style.transition = "none";
        }, { passive: true });

        dragHandleArea.addEventListener("touchmove", (e) => {
          if (!isDragging) return;
          currentY = e.touches[0].clientY - startY;
          if (currentY > 0) {
            controlPanel.style.transform = `translateY(${currentY}px)`;
          }
        }, { passive: true });

        dragHandleArea.addEventListener("touchend", () => {
          if (!isDragging) return;
          isDragging = false;
          controlPanel.style.transition = "transform 0.4s cubic-bezier(0.32, 0.72, 0, 1)";
          if (currentY > 100) {
            closeSheet();
          } else {
            openSheet();
          }
          currentY = 0;
        });
      }

    })();
  </script>
</body>
</html>
